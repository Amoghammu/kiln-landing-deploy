    function Icon({ name, size = 20, className = '', style }) {
      return (
        <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"

          {ICON_PATHS[name]}
        </svg>
      );
    }

    /* =====================================================================
       3. HOOKS
       ===================================================================== */
    function useScrolled(offset = 12) {
      const [scrolled, setScrolled] = useState(false);
      useEffect(() => {
        const onScroll = () => setScrolled(window.scrollY > offset);
        onScroll();
        window.addEventListener('scroll', onScroll, { passive: true });
        return () => window.removeEventListener('scroll', onScroll);
      }, [offset]);
      return scrolled;
    }

    function useScrollSpy(ids) {
      const [active, setActive] = useState('');
      useEffect(() => {
        const els = ids.map((id) => document.getElementById(id)).filter(Boolean);
        const observer = new IntersectionObserver(
          (entries) => entries.forEach((e) => e.isIntersecting && setActive(e.target.id)),
          { rootMargin: '-40% 0px -55% 0px' }
        );
        els.forEach((el) => observer.observe(el));
        return () => observer.disconnect();
      }, [ids]);
      return active;
    }

    /* =====================================================================
       4. REUSABLE UI COMPONENTS
       ===================================================================== */
    function Container({ className, children, ...props }) {
      return <div className={cn('mx-auto w-full max-w-6xl px-5 sm:px-8', className)} {...props}>{children}</div>;
    }

    const BUTTON_VARIANTS = {
      primary: 'bg-cobalt text-white hover:bg-cobalt-dark',
      secondary: 'border border-ink/25 text-ink hover:border-ink hover:bg-white',
      ink: 'bg-ink text-slip hover:bg-ink/85',
      light: 'bg-white text-ink hover:bg-celadon',
    };
    const BUTTON_SIZES = { md: 'px-5 py-2.5 text-sm', lg: 'px-6 py-3.5 text-base' };

    function Button({ variant = 'primary', size = 'md', href, className, children, ...props }) {
      const classes = cn(
        'inline-flex items-center justify-center gap-2 rounded-full font-medium transition duration-200 active:scale-[0.98]',
        BUTTON_VARIANTS[variant], BUTTON_SIZES[size], className
      );
      return href
        ? <a href={href} className={classes} {...props}>{children}</a>
        : <button type="button" className={classes} {...props}>{children}</button>;
    }

    function Reveal({ as: Tag = 'div', delay = 0, className, children, ...props }) {
      const ref = useRef(null);
      const [visible, setVisible] = useState(false);
      useEffect(() => {
        const el = ref.current;
        if (!el) return undefined;
        if (!('IntersectionObserver' in window)) { setVisible(true); return undefined; }
        const observer = new IntersectionObserver(([entry]) => {
          if (entry.isIntersecting) { setVisible(true); observer.disconnect(); }
        }, { threshold: 0.15 });
        observer.observe(el);
        return () => observer.disconnect();
      }, []);
      return (
        <Tag ref={ref} style={{ '--delay': `${delay}ms` }} className={cn('reveal', visible && 'is-visible', className)} {...props}>
          {children}
        </Tag>
      );
    }

    function SectionHeading({ id, title, description, align = 'left', className }) {
      return (
        <div className={cn('max-w-2xl', align === 'center' && 'mx-auto text-center', className)}>

          {description && <p className="mt-4 text-lg leading-relaxed text-ink/70">{description}</p>}

      );
    }

    function Logo({ className = '' }) {
      return (

    /* ---- Interactive hero visual: click a piece to advance its firing stage ---- */
    const STAGES = ['Greenware', 'Bisque', 'Glazed', 'Fired'];
    const STAGE_CHIP = ['bg-ink/10 text-ink', 'bg-white text-ink', 'bg-ochre/40 text-ink', 'bg-cobalt text-white'];
    const SHAPES = {
      bowl: { paths: ['M10 34 H70 C70 56 56 68 40 68 C24 68 10 56 10 34 Z'] },
      vase: { paths: ['M32 10 H48 V20 C48 28 62 32 62 50 C62 64 52 70 40 70 C28 70 18 64 18 50 C18 32 32 28 32 20 Z'] },

      jar: { paths: ['M24 24 H56 V32 C64 36 66 48 62 58 C60 66 52 70 40 70 C28 70 20 66 18 58 C14 48 16 36 24 32 Z', 'M28 14 H52 V24 H28 Z'] },

    const INITIAL_PIECES = [

      { id: 3, shape: 'mug', maker: 'Priya', glaze: '#4F7C69', stage: 2 },
      { id: 4, shape: 'plate', maker: 'Joon', glaze: '#2F4FA8', stage: 3 },
      { id: 5, shape: 'jar', maker: 'Lena', glaze: '#E3A72F', stage: 0 },
      { id: 6, shape: 'mug', maker: 'Tomas', glaze: '#2F4FA8', stage: 1 },
      { id: 7, shape: 'bowl', maker: 'Ife', glaze: '#A8442B', stage: 2 },
      { id: 8, shape: 'vase', maker: 'Sam', glaze: '#2F4FA8', stage: 2 },
      { id: 9, shape: 'cup', maker: 'Rae', glaze: '#E3A72F', stage: 3 },
    ];

    function Piece({ shape, glaze, stage }) {
      const { paths, handle } = SHAPES[shape];
      const base = stage === 0 ? '#B3AC9E' : '#E6DAC8';
      const glazeOpacity = stage === 2 ? 0.6 : stage === 3 ? 1 : 0;
      const fade = { transition: 'fill 500ms ease, stroke 500ms ease, opacity 500ms ease' };
      return (
        <svg viewBox="0 0 80 80" className="h-16 w-16 sm:h-20 sm:w-20" aria-hidden="true">
          {handle && (
            <>
              <path d={handle} fill="none" strokeWidth="6" strokeLinecap="round" style={{ ...fade, stroke: base }} />
              <path d={handle} fill="none" strokeWidth="6" strokeLinecap="round" style={{ ...fade, stroke: glaze, opacity: glazeOpacity }} />
            </>
          )}
          {paths.map((d) => (
            <g key={d}>
              <path d={d} style={{ ...fade, fill: base }} />
              <path d={d} style={{ ...fade, fill: glaze, opacity: glazeOpacity }} />
            </g>
          ))}
          <path d="M20 40 C20 50 24 58 30 62" fill="none" stroke="#fff" strokeWidth="3" strokeLinecap="round"
            style={{ ...fade, opacity: stage === 3 ? 0.4 : 0 }} />
        </svg>
      );
    }

    function KilnLoad() {
      const [pieces, setPieces] = useState(INITIAL_PIECES);
      const fired = useMemo(() => pieces.filter((p) => p.stage === 3).length, [pieces]);
      const advance = (id) => setPieces((list) => list.map((p) => (p.id === id ? { ...p, stage: (p.stage + 1) % STAGES.length } : p)));
      const shelves = [pieces.slice(0, 3), pieces.slice(3, 6), pieces.slice(6, 9)];

      return (
        <div className="rounded-3xl bg-celadon p-4 sm:p-6">
          <div className="flex items-center justify-between gap-3 px-1 pb-4">
            <div>
              <p className="font-display text-lg font-semibold leading-tight">Friday cone 6 firing</p>
              <p className="text-sm text-ink/70" aria-live="polite">{fired} of {pieces.length} pieces fired</p>
            </div>
            <button type="button" onClick={() => setPieces(INITIAL_PIECES)}
              className="inline-flex items-center gap-1.5 rounded-full bg-white/70 px-3 py-1.5 text-sm font-medium transition hover:bg-white">
              <Icon name="RotateCcw" size={14} /> Reset
            </button>
          </div>
          <div className="rounded-2xl bg-slip px-3 pb-3 pt-4 sm:px-5">
            {shelves.map((shelf, i) => (
              <div key={i} className="mb-2 last:mb-0">
                <div className="grid grid-cols-3 gap-2">
                  {shelf.map((p) => (
                    <button key={p.id} type="button" onClick={() => advance(p.id)}
                      aria-label={`${p.maker}'s ${p.shape}, ${STAGES[p.stage]}. Move to next stage.`}
                      className="group flex flex-col items-center gap-1 rounded-xl px-1 pt-1 transition duration-200 hover:-translate-y-1">
                      <Piece shape={p.shape} glaze={p.glaze} stage={p.stage} />
                      <span className="text-xs font-medium text-ink/70">{p.maker}</span>
                      <span className={cn('rounded-full px-2 py-0.5 text-[11px] font-medium transition-colors duration-500', STAGE_CHIP[p.stage])}>
                        {STAGES[p.stage]}
                      </span>
                    </button>
                  ))}
                </div>
                <div className="mt-2 h-2 rounded-full bg-ink" />
              </div>
            ))}
          </div>
          <p className="px-1 pt-3 text-sm text-ink/70">Tap any piece to move it to its next stage.</p>
        </div>
      );
    }

    /* =====================================================================
       5. SECTIONS
       ===================================================================== */

    /* ---- 1. Navbar ---- */
    function Navbar() {
      const [open, setOpen] = useState(false);
      const scrolled = useScrolled();
      const active = useScrollSpy(SECTION_IDS);

      useEffect(() => {
        const onKey = (e) => e.key === 'Escape' && setOpen(false);
        window.addEventListener('keydown', onKey);
        return () => window.removeEventListener('keydown', onKey);
      }, []);

      return (
        <header id="top" className={cn('fixed inset-x-0 top-0 z-50 border-b transition-colors duration-300',
          scrolled || open ? 'border-ink/10 bg-slip/90 backdrop-blur' : 'border-transparent bg-transparent')}>
          <Container className="flex h-16 items-center justify-between">
            <Logo />
            <nav aria-label="Primary" className="hidden items-center gap-1 md:flex">
              {NAV_LINKS.map((link) => (
                <a key={link.href} href={link.href}
                  className={cn('rounded-full px-3.5 py-2 text-sm font-medium transition-colors hover:bg-ink/5',
                    active === link.href.slice(1) ? 'text-cobalt' : 'text-ink/75')}>
                  {link.label}
                </a>
              ))}
            </nav>
            <div className="hidden md:block"><Button href="#pricing">Start free trial</Button></div>
            <button type="button" className="-mr-2 rounded-full p-2 md:hidden" aria-label={open ? 'Close menu' : 'Open menu'}
              aria-expanded={open} aria-controls="mobile-menu" onClick={() => setOpen((v) => !v)}>
              <Icon name={open ? 'X' : 'Menu'} size={24} />
            </button>
          </Container>

          <div id="mobile-menu" className={cn('grid transition-[grid-template-rows] duration-300 ease-out md:hidden',
            open ? 'grid-rows-[1fr]' : 'grid-rows-[0fr]')}>
            <div className="overflow-hidden">
              <nav aria-label="Mobile" className="flex flex-col gap-1 px-5 pb-6 pt-2 sm:px-8">
                {NAV_LINKS.map((link) => (
                  <a key={link.href} href={link.href} tabIndex={open ? 0 : -1} onClick={() => setOpen(false)}
                    className="rounded-xl px-3 py-3 text-lg font-medium hover:bg-ink/5">{link.label}</a>
                ))}
                <Button href="#pricing" size="lg" tabIndex={open ? 0 : -1} onClick={() => setOpen(false)} className="mt-3">
                  Start free trial
                </Button>
              </nav>
            </div>
          </div>
        </header>
      );
    }

    /* ---- 2. Hero ---- */
    const rise = (ms) => ({ animationDelay: `${ms}ms` });

    function Hero() {
      return (
        <section aria-labelledby="hero-title" className="pb-20 pt-32 sm:pb-28 sm:pt-36 lg:pt-40">
          <Container className="grid items-center gap-12 lg:grid-cols-[1.05fr_1fr] lg:gap-16">
            <div>
              <h1 id="hero-title" style={rise(0)} className="animate-rise text-4xl font-semibold leading-[1.05] tracking-tight sm:text-5xl lg:text-6xl">
                Run your pottery studio without the clipboard
              </h1>
              <p style={rise(120)} className="animate-rise mt-6 max-w-xl text-lg leading-relaxed text-ink/70">
                Kiln keeps class bookings, memberships and every firing in one place, so nothing gets lost between the wheel and the kiln.
              </p>
              <div style={rise(240)} className="animate-rise mt-8 flex flex-col gap-3 sm:flex-row">
                <Button href="#pricing" size="lg">Start free for 30 days <Icon name="ArrowRight" size={18} /></Button>
                <Button href="#how-it-works" size="lg" variant="secondary"><Icon name="Play" size={16} /> See how it works</Button>
              </div>
              <p style={rise(360)} className="animate-rise mt-6 text-sm text-ink/60">No card needed. Trusted by 480 studios in 31 countries.</p>
            </div>
            <div style={rise(300)} className="animate-rise"><KilnLoad /></div>
          </Container>
        </section>
      );
    }

    /* ---- 3. About ---- */
    function CompareList({ title, items, positive }) {
      return (
        <div className={positive ? 'rounded-2xl bg-ink p-6 text-slip sm:p-7' : 'rounded-2xl border border-ink/15 bg-white p-6 sm:p-7'}>
          <h3 className="text-lg font-semibold">{title}</h3>
          <ul className="mt-4 space-y-3">
            {items.map((item) => (
              <li key={item} className="flex items-start gap-3 text-[15px] leading-snug">
                <Icon name={positive ? 'Check' : 'X'} size={18} className={positive ? 'mt-0.5 shrink-0 text-ochre' : 'mt-0.5 shrink-0 text-ink/40'} />
                <span className={positive ? '' : 'text-ink/65'}>{item}</span>
              </li>
            ))}
          </ul>
        </div>
      );
    }

    function About() {
      return (
        <section id="about" aria-labelledby="about-title" className="scroll-mt-20 py-20 sm:py-28">
          <Container className="grid gap-12 lg:grid-cols-2 lg:gap-16">
            <Reveal>
              <SectionHeading id="about-title" title={ABOUT.title} />
              <div className="mt-6 max-w-xl space-y-4 text-lg leading-relaxed text-ink/70">
                {ABOUT.paragraphs.map((p) => <p key={p}>{p}</p>)}
              </div>
            </Reveal>
            <Reveal delay={120} className="grid gap-4 sm:grid-cols-2">
              <CompareList title="Before Kiln" items={ABOUT.before} />
              <CompareList title="With Kiln" items={ABOUT.after} positive />
            </Reveal>
          </Container>
        </section>
      );
    }

    /* ---- 4. Features ---- */
    const TONES = {
      white: { card: 'bg-white border border-ink/10', icon: 'bg-cobalt-light text-cobalt', text: 'text-ink/70' },
      ink: { card: 'bg-ink text-slip', icon: 'bg-white/10 text-ochre', text: 'text-slip/75' },
      celadon: { card: 'bg-celadon', icon: 'bg-white/60 text-ink', text: 'text-ink/75' },
    };

    function FeatureCard({ icon, title, text, tags, wide, tone = 'white', delay }) {
      const t = TONES[tone];
      return (
        <Reveal as="article" delay={delay}
          className={cn('group rounded-2xl p-6 transition duration-300 hover:-translate-y-1 hover:shadow-lg hover:shadow-ink/10 sm:p-7', t.card, wide && 'lg:col-span-2')}>
          <div className={cn('flex h-11 w-11 items-center justify-center rounded-xl transition-transform duration-300 group-hover:rotate-6', t.icon)}>
            <Icon name={icon} size={22} />
          </div>
          <h3 className="mt-5 text-xl font-semibold tracking-tight">{title}</h3>
          <p className={cn('mt-2 max-w-xl leading-relaxed', t.text)}>{text}</p>
          {tags && (
            <ul className="mt-5 flex flex-wrap gap-2">
              {tags.map((tag) => <li key={tag} className="rounded-full bg-white/10 px-3 py-1 text-sm">{tag}</li>)}
            </ul>
          )}
        </Reveal>
      );
    }

    function Features() {
      return (
        <section id="features" aria-labelledby="features-title" className="scroll-mt-20 bg-white/50 py-20 sm:py-28">
          <Container>
            <Reveal>
              <SectionHeading id="features-title" title="Everything a studio does, in one place"
                description="From the first booking to the last pickup, Kiln covers the work that happens around the clay." />
            </Reveal>
            <div className="mt-12 grid gap-5 sm:grid-cols-2 lg:grid-cols-3">
              {FEATURES.map((f, i) => <FeatureCard key={f.title} {...f} delay={(i % 3) * 80} />)}
            </div>
          </Container>
        </section>
      );
    }

    /* ---- 5. How it works ---- */
    function HowItWorks() {
      return (
        <section id="how-it-works" aria-labelledby="how-title" className="scroll-mt-20 py-20 sm:py-28">
          <Container>
            <Reveal>
              <SectionHeading id="how-title" align="center" title="From the first class to the last pickup in four steps"
                description="Most studios are taking bookings the same day they sign up." />
            </Reveal>
            <ol className="relative mt-14 grid gap-10 sm:grid-cols-2 lg:grid-cols-4 lg:gap-6">
              <div aria-hidden="true" className="absolute left-[12.5%] right-[12.5%] top-8 hidden h-px border-t-2 border-dashed border-ink/20 lg:block" />
              {STEPS.map((step, i) => (
                <Reveal as="li" key={step.title} delay={i * 100} className="relative text-center">
                  <div className="relative mx-auto flex h-16 w-16 items-center justify-center rounded-full border-2 border-ink bg-slip transition-colors duration-300 hover:bg-celadon">
                    <Icon name={step.icon} size={26} />
                    <span className="absolute -right-1 -top-1 flex h-6 w-6 items-center justify-center rounded-full bg-cobalt text-xs font-bold text-white">{i + 1}</span>
                  </div>
                  <h3 className="mt-5 text-xl font-semibold tracking-tight">{step.title}</h3>
                  <p className="mx-auto mt-2 max-w-xs leading-relaxed text-ink/70">{step.text}</p>
                </Reveal>
              ))}
            </ol>
          </Container>
        </section>
      );
    }

    /* ---- 6. Testimonials ---- */
    const initials = (name) => name.split(' ').map((n) => n[0]).join('');

    function Review({ quote, name, role, featured, delay }) {
      return (
        <Reveal as="figure" delay={delay}
          className={cn('flex flex-col justify-between rounded-2xl p-6 transition duration-300 hover:-translate-y-1 sm:p-8',
            featured ? 'bg-cobalt text-white lg:row-span-2' : 'border border-ink/10 bg-white')}>
          <div>
            <div className="flex gap-0.5" role="img" aria-label="5 out of 5 stars">
              {[0, 1, 2, 3, 4].map((i) => <Icon key={i} name="Star" size={16} className="fill-ochre text-ochre" />)}
            </div>
            <blockquote className={cn('mt-5 leading-relaxed', featured ? 'font-display text-2xl font-medium sm:text-3xl' : 'text-lg')}>{quote}</blockquote>
          </div>
          <figcaption className="mt-8 flex items-center gap-3">
            <span aria-hidden="true" className={cn('flex h-11 w-11 items-center justify-center rounded-full text-sm font-bold', featured ? 'bg-white text-cobalt' : 'bg-celadon text-ink')}>
              {initials(name)}
            </span>
            <span>
              <span className="block font-semibold">{name}</span>
              <span className={cn('block text-sm', featured ? 'text-white/75' : 'text-ink/60')}>{role}</span>
            </span>
          </figcaption>
        </Reveal>
      );
    }

    function Testimonials() {
      return (
        <section id="reviews" aria-labelledby="reviews-title" className="scroll-mt-20 bg-white/50 py-20 sm:py-28">
          <Container>
            <Reveal>
              <SectionHeading id="reviews-title" title="Studios that stopped losing pieces" description="Hear from the people who run Kiln day to day." />
            </Reveal>
            <div className="mt-12 grid gap-5 lg:grid-cols-2">
              {TESTIMONIALS.map((t, i) => <Review key={t.name} {...t} delay={i * 100} />)}
            </div>
          </Container>
        </section>
      );
    }

    /* ---- 7. Pricing ---- */
    const YEARLY_DISCOUNT = 0.2;

    function BillingToggle({ yearly, onChange }) {
      const option = (isYearly, label) => (
        <button type="button" role="radio" aria-checked={yearly === isYearly} onClick={() => onChange(isYearly)}
          className={cn('rounded-full px-4 py-2 text-sm font-medium transition-colors duration-200', yearly === isYearly ? 'bg-ink text-slip' : 'text-ink/70 hover:text-ink')}>
          {label}
        </button>
      );
      return (
        <div role="radiogroup" aria-label="Billing period" className="inline-flex items-center rounded-full border border-ink/15 bg-white p-1">
          {option(false, 'Monthly')}
          {option(true, 'Yearly, save 20%')}
        </div>
      );
    }

    function PlanCard({ plan, yearly, delay }) {
      const price = yearly ? Math.round(plan.price * (1 - YEARLY_DISCOUNT)) : plan.price;
      return (
        <Reveal as="article" delay={delay}
          className={cn('relative flex flex-col rounded-2xl p-7 transition duration-300 hover:-translate-y-1',
            plan.popular ? 'bg-ink text-slip shadow-xl shadow-ink/20 lg:-my-4 lg:py-11' : 'border border-ink/10 bg-white')}>
          {plan.popular && <span className="absolute -top-3 left-7 rounded-full bg-ochre px-3 py-1 text-xs font-bold text-ink">Most popular</span>}
          <h3 className="text-xl font-semibold">{plan.name}</h3>
          <p className={cn('mt-1 text-[15px]', plan.popular ? 'text-slip/70' : 'text-ink/65')}>{plan.description}</p>
          <p className="mt-6 flex items-baseline gap-1">
            <span className="font-display text-5xl font-semibold tracking-tight">${price}</span>
            <span className={plan.popular ? 'text-slip/70' : 'text-ink/60'}>per month</span>
          </p>
          <p className={cn('mt-1 h-5 text-sm', plan.popular ? 'text-slip/60' : 'text-ink/50')}>{yearly ? 'Billed yearly' : 'Billed monthly'}</p>
          <ul className="mt-6 flex-1 space-y-3">
            {plan.features.map((f) => (
              <li key={f} className="flex items-start gap-3 text-[15px]">
                <Icon name="Check" size={18} className={cn('mt-0.5 shrink-0', plan.popular ? 'text-ochre' : 'text-cobalt')} /> {f}
              </li>
            ))}
          </ul>
          <Button href="#contact" size="lg" variant={plan.popular ? 'light' : 'secondary'} className="mt-8 w-full">{plan.cta}</Button>
        </Reveal>
      );
    }

    function Pricing() {
      const [yearly, setYearly] = useState(true);
      return (
        <section id="pricing" aria-labelledby="pricing-title" className="scroll-mt-20 py-20 sm:py-28">
          <Container>
            <Reveal className="flex flex-col items-center">
              <SectionHeading id="pricing-title" align="center" title="Simple pricing that grows with your studio"
                description="Every plan starts with a 30-day free trial. Cancel any time." />
              <div className="mt-8"><BillingToggle yearly={yearly} onChange={setYearly} /></div>
            </Reveal>
            <div className="mx-auto mt-14 grid max-w-md gap-8 lg:max-w-none lg:grid-cols-3 lg:items-stretch lg:gap-6">
              {PLANS.map((plan, i) => <PlanCard key={plan.name} plan={plan} yearly={yearly} delay={i * 100} />)}
            </div>
          </Container>
        </section>
      );
    }

    /* ---- 8. Footer ---- */
    const SOCIALS = ['Instagram', 'Youtube', 'Facebook', 'Linkedin'];
    const CONTACT = [
      { icon: 'Mail', text: 'hello@kiln.studio', href: 'mailto:hello@kiln.studio' },
      { icon: 'Phone', text: '+1 (555) 014-2290', href: 'tel:+15550142290' },
      { icon: 'MapPin', text: '24 Foundry Lane, Portland, OR' },
    ];

    function Footer() {
      return (
        <footer id="contact" className="scroll-mt-20 bg-ink pb-8 pt-16 text-slip">
          <Container>
            <div className="grid gap-12 lg:grid-cols-[1.4fr_2fr]">
              <div>
                <Logo className="text-slip" />
                <p className="mt-4 max-w-xs leading-relaxed text-slip/70">Studio software for the people who make, teach and fire pottery.</p>
                <ul className="mt-6 space-y-3 text-[15px]">
                  {CONTACT.map(({ icon, text, href }) => (
                    <li key={text} className="flex items-center gap-3 text-slip/80">
                      <Icon name={icon} size={18} className="shrink-0 text-ochre" />
                      {href ? <a href={href} className="transition-colors hover:text-white hover:underline">{text}</a> : <span>{text}</span>}
                    </li>
                  ))}
                </ul>
              </div>
              <nav aria-label="Footer" className="grid grid-cols-2 gap-8 sm:grid-cols-3">
                {FOOTER_LINKS.map((group) => (
                  <div key={group.title}>
                    <h3 className="text-base font-semibold">{group.title}</h3>
                    <ul className="mt-4 space-y-3 text-[15px]">
                      {group.links.map((link) => (
                        <li key={link.label}><a href={link.href} className="text-slip/70 transition-colors hover:text-white hover:underline">{link.label}</a></li>
                      ))}
                    </ul>
                  </div>
                ))}
              </nav>
            </div>
            <div className="mt-14 flex flex-col items-start justify-between gap-6 border-t border-white/15 pt-6 sm:flex-row sm:items-center">
              <p className="text-sm text-slip/60">&copy; {new Date().getFullYear()} Kiln Studio Software. All rights reserved.</p>
              <ul className="flex gap-2">
                {SOCIALS.map((name) => (
                  <li key={name}>
                    <a href="#" aria-label={name} className="flex h-10 w-10 items-center justify-center rounded-full bg-white/10 transition duration-200 hover:-translate-y-0.5 hover:bg-ochre hover:text-ink">
                      <Icon name={name} />
                    </a>
                  </li>
                ))}
              </ul>
            </div>
          </Container>
        </footer>
      );
    }

    /* =====================================================================
       6. APP
       ===================================================================== */
    function App() {
      return (
        <>
          <a href="#main" className="sr-only focus:not-sr-only focus:fixed focus:left-4 focus:top-4 focus:z-[60] focus:rounded-full focus:bg-ink focus:px-4 focus:py-2 focus:text-slip">Skip to content</a>
          <Navbar />
          <main id="main">
            <Hero />
            <About />
            <Features />
            <HowItWorks />
            <Testimonials />
            <Pricing />
          </main>
          <Footer />
        </>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
